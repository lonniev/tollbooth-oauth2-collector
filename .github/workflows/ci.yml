# CI for the OAuth2 collector.
#
# Load-bearing choice: install runtime deps from **requirements.txt**, because that is the
# file the deploy platform (Horizon) builds from for this service. Installing from
# pyproject.toml instead would have let v0.2.3 pass CI while shipping a collector with no
# `tollbooth` module — the missing dep that crashed store_code and stranded every consumer's
# OAuth on `pending`. Test the same dependency set you deploy, and the tests (which import
# `server` and exercise store_code → _encrypt_code → the tollbooth import) catch it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Poll the SIMPLE index, because that is what pip resolves from.
      #
      # Three shapes of this step have been wrong, each differently. It first
      # polled the simple index but exited SUCCESS on exhaustion, so a real
      # lag surfaced as a confusing install failure. Fixing that moved it to
      # the JSON API and made it fail loudly — but the JSON API publishes
      # seconds ahead of the simple index, so on 0.88.0 the step passed on
      # attempt 1 and `pip install` failed anyway. A gate is only a gate if
      # it waits on the thing the next step actually needs.
      - name: Wait for tollbooth-dpyc on PyPI
        run: |
            set -euo pipefail
            REQUIRED=$(grep -oE 'tollbooth-dpyc(\[[a-z,]+\])?==[0-9.]+' pyproject.toml \
                       | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
            if [ -z "$REQUIRED" ]; then
              echo "No pinned tollbooth-dpyc version found; nothing to wait for."
              exit 0
            fi
            echo "Waiting for tollbooth-dpyc==$REQUIRED on the PyPI simple index..."
            ESCAPED=${REQUIRED//./\\.}
            for i in $(seq 1 30); do
              # Distribution filenames carry the version; match the dash-delimited
              # form so 0.88.0 cannot be satisfied by 0.88.01.
              if curl -sf "https://pypi.org/simple/tollbooth-dpyc/" \
                   | grep -qE "tollbooth[_-]dpyc-$ESCAPED[-.]"; then
                echo "Found tollbooth-dpyc==$REQUIRED on the simple index (attempt $i)"
                exit 0
              fi
              echo "Attempt $i/30 — not yet resolvable by pip, waiting 10s..."
              sleep 10
            done
            echo "::error::tollbooth-dpyc==$REQUIRED never reached the PyPI simple index after 5 minutes."
            echo "pip resolves from that index, so the install below would fail. Check"
            echo "that the release workflow PyPI publish succeeded before re-running."
            exit 1


      - name: requirements.txt / pyproject.toml pin parity
        run: |
          fail=0
          for pkg in tollbooth-dpyc fastmcp; do
            r=$(grep -oE "${pkg}==[0-9.]+" requirements.txt || true)
            p=$(grep -oE "${pkg}==[0-9.]+" pyproject.toml || true)
            if [ "$r" != "$p" ]; then
              echo "::error::pin drift for ${pkg}: requirements.txt='${r:-none}' vs pyproject.toml='${p:-none}'. The deploy installs from requirements.txt — keep them in lockstep."
              fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "pins in lockstep."
          exit $fail

      # Install EXACTLY what the platform deploys, then add test-only tools (which must not
      # drag in the package's runtime deps — that would mask a missing runtime dependency).
      - name: Install (from the deploy's requirements.txt)
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio ruff

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest tests/ -v

      - name: Entrypoint inspects (the check Horizon performs at build time)
        run: |
          [ -f fastmcp.json ] || { echo "no fastmcp.json — not a FastMCP deployment; skipping"; exit 0; }
          ENTRY=$(python -c "import json;print(json.load(open('fastmcp.json'))['server'])")
          case "$ENTRY" in *:*) TARGET="$ENTRY";; *) TARGET="$ENTRY:mcp";; esac
          echo "inspecting $TARGET"
          if [ -f uv.lock ] && command -v uv >/dev/null 2>&1; then
            uv run fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          else
            fastmcp inspect -f fastmcp -o /tmp/server-info.json "$TARGET"
          fi
